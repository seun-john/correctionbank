[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "correctionbank"
version = "0.1.0"
description = "A local, scoped memory for what went wrong with AI work: corrections, regression cases and decisions that must not drift."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "seun-john" }]
keywords = ["ai", "corrections", "regression", "decisions", "memory", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
correctionbank = "correctionbank.cli:main"

[project.urls]
Homepage = "https://github.com/seun-john/correctionbank"
Issues = "https://github.com/seun-john/correctionbank/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/correctionbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]
